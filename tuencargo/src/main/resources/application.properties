spring.application.name=tuencargo
server.port=8080

# Base de datos H2 en archivo (persistente entre reinicios)
spring.datasource.url=jdbc:h2:file:./data/tuencargo;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola H2 para la demostración: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# TRM simulada usada por el adaptador de tipo de cambio
tuencargo.fx.usd-cop=4100.00
