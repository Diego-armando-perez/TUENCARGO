<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedidos (admin)')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>

<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <div class="card-head">
            <h1>Pedidos y logística</h1>
            <a class="btn btn-ghost btn-sm" th:href="@{/admin/rates}">Tarifas</a>
        </div>
        <p class="muted">Avanza cada pedido por la máquina de estados:
            Pendiente de pago → Comprado → En bodega → En tránsito → Entregado.</p>

        <div class="table-wrap" th:if="${!#lists.isEmpty(orders)}">
            <table>
                <thead>
                <tr><th>Pedido</th><th>Cliente</th><th>Producto</th><th>Total COP</th>
                    <th>Estado</th><th>Siguiente</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="mono" th:text="${o.orderNumber}">TC-0000</td>
                    <td th:text="${o.customerEmail}">cliente@correo.com</td>
                    <td th:text="${o.productName}">Producto</td>
                    <td th:text="'$' + ${#numbers.formatDecimal(o.totalCop, 1, 'POINT', 0, 'COMMA')}">0</td>
                    <td><span class="badge"
                              th:classappend="${'badge-' + #strings.toLowerCase(o.status.name())}"
                              th:text="${o.status.label()}">Estado</span></td>
                    <td th:text="${o.status.nextLogisticStatus() != null ? o.status.nextLogisticStatus().label() : '—'}">—</td>
                    <td class="nowrap">
                        <form th:action="@{/admin/orders/{id}/advance(id=${o.id})}" method="post" class="inline"
                              th:if="${o.status.nextLogisticStatus() != null}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="hidden" name="note" value="Actualizado desde el panel de administración">
                            <button class="btn btn-primary btn-sm" type="submit">Avanzar</button>
                        </form>
                        <a th:href="@{/orders/{id}(id=${o.id})}">Ver</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <p class="muted" th:if="${#lists.isEmpty(orders)}">Aún no hay pedidos registrados.</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
