<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' · TuEncargo'">TuEncargo</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<header th:fragment="nav">
    <div class="nav-inner">
        <a class="brand" th:href="@{/}">Tu<span>Encargo</span></a>
        <nav class="nav-links" aria-label="Navegación principal">
            <a th:href="@{/}" th:if="${cu != null}">Panel</a>
            <a th:href="@{/quotations/new}" th:if="${cu != null}">Cotizar</a>
            <a th:href="@{/quotations}" th:if="${cu != null}">Cotizaciones</a>
            <a th:href="@{/orders}" th:if="${cu != null}">Pedidos</a>
            <a th:href="@{/notifications}" th:if="${cu != null}">Buzón</a>
            <a th:href="@{/admin}" th:if="${isAdmin}">Administración</a>
            <a th:href="@{/login}" th:if="${cu == null}">Ingresar</a>
            <a th:href="@{/register}" th:if="${cu == null}">Crear cuenta</a>
        </nav>
        <div class="nav-user" th:if="${cu != null}">
            <span class="nav-name" th:text="${cu.fullName}">Usuario</span>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-ghost btn-sm" type="submit">Salir</button>
            </form>
        </div>
    </div>
</header>

<div th:fragment="flash">
    <div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div>
    <div class="alert alert-ok" th:if="${ok != null}" th:text="${ok}"></div>
</div>

<footer th:fragment="footer">
    <div class="container footer-inner">
        <p>TuEncargo · Compras internacionales sin complicaciones</p>
        <p class="muted">MVP Incremento 1 · Ingeniería de Software 1</p>
    </div>
</footer>

</body>
</html>
